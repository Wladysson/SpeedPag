  name: Validate gRPC

  on:
    push:
      branches:
        - main
        - develop

    pull_request:
      branches:
        - main
        - develop

  permissions:
    contents: read

  jobs:
    validate-grpc:
      name: Validate gRPC contracts
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Discover Protocol Buffer files
          id: discover
          shell: bash
          run: |
            set -euo pipefail
            
            echo "Searching for Protocol Buffer definitions..."
            
            mapfile -t FILES < <(
              find . \
                -type f \
                -name "*.proto" \
                -not -path "./.git/*" \
                | sort
            )
            
            if [ "${#FILES[@]}" -eq 0 ]; then
              echo "⚠️ No .proto files found."
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            
            echo "found=true" >> "$GITHUB_OUTPUT"
            
            echo ""
            echo "📋 Protocol Buffer files found:"
            printf ' - %s\n' "${FILES[@]}"
            
            {
              echo "## 📋 Protocol Buffer Files"
              echo ""
              for file in "${FILES[@]}"; do
                echo "- \`$file\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"

        - name: 📦 Install protoc
          if: steps.discover.outputs.found == 'true'
          shell: bash
          run: |
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler

        - name: Show protoc version
          if: steps.discover.outputs.found == 'true'
          run: |
            protoc --version

        - name: Validate Protocol Buffer syntax
          if: steps.discover.outputs.found == 'true'
          shell: bash
          run: |
            set -euo pipefail
            
            echo "Starting gRPC / Protobuf validation..."
            echo ""
            
            FAILED=0
            
            while IFS= read -r file; do
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "Validating: $file"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
              if protoc \
                --proto_path="$(dirname "$file")" \
                --descriptor_set_out=/tmp/proto_descriptor.pb \
                "$file"; then
            
                echo "Valid: $file"
            
              else
            
                echo "Invalid: $file"
                FAILED=1
            
              fi
            
              echo ""
            done < <(
              find . \
                -type f \
                -name "*.proto" \
                -not -path "./.git/*" \
                | sort
            )
            
            if [ "$FAILED" -ne 0 ]; then
              echo "gRPC / Protobuf validation failed."
              exit 1
            fi
            
            echo "All Protocol Buffer definitions are valid."

        - name: 📊 Generate job summary
          if: always()
          run: |
            {
              echo ""
              echo "## gRPC Validation"
              echo ""
              echo "| Check | Status |"
              echo "|---|---|"
              echo "| Protobuf discovery | Completed |"
              echo "| Protobuf compiler | Installed |"
              echo "| Syntax validation | Completed |"
              echo ""
              echo "### Result"
              echo "gRPC validation workflow finished."
            } >> "$GITHUB_STEP_SUMMARY"
