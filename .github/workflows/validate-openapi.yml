  name: Validate OpenAPI

  on:
    push:
      branches:
        - main
        - develop

    pull_request:
      branches:
        - main
        - develop

  permissions:
    contents: read

  jobs:
    validate-openapi:
      name: Validate OpenAPI specifications
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Discover OpenAPI specifications
          id: discover
          shell: bash
          run: |
            set -euo pipefail
            
            echo "Searching for OpenAPI specifications..."
            
            mapfile -t FILES < <(
              find . \
                -type f \
                \( \
                  -name "openapi.yaml" \
                  -o -name "openapi.yml" \
                  -o -name "openapi.json" \
                  -o -name "*openapi.yaml" \
                  -o -name "*openapi.yml" \
                  -o -name "*openapi.json" \
                \) \
                -not -path "./.git/*" \
                | sort
            )
            
            if [ "${#FILES[@]}" -eq 0 ]; then
              echo "⚠️ No OpenAPI specification found."
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            
            echo "found=true" >> "$GITHUB_OUTPUT"
            
            echo ""
            echo "📋 OpenAPI specifications found:"
            printf ' - %s\n' "${FILES[@]}"
            
            {
              echo "## 📋 OpenAPI Specifications"
              echo ""
              for file in "${FILES[@]}"; do
                echo "- \`$file\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"

        - name: 📦 Install Redocly CLI
          if: steps.discover.outputs.found == 'true'
          run: |
            npm install --global @redocly/cli

        - name: Validate OpenAPI specifications
          if: steps.discover.outputs.found == 'true'
          shell: bash
          run: |
            set -euo pipefail
            
            echo "Starting OpenAPI validation..."
            echo ""
            
            FAILED=0
            
            while IFS= read -r file; do
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "Validating: $file"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
              if redocly lint "$file"; then
                echo "Valid: $file"
              else
                echo "Invalid: $file"
                FAILED=1
              fi
            
              echo ""
            done < <(
              find . \
                -type f \
                \( \
                  -name "openapi.yaml" \
                  -o -name "openapi.yml" \
                  -o -name "openapi.json" \
                  -o -name "*openapi.yaml" \
                  -o -name "*openapi.yml" \
                  -o -name "*openapi.json" \
                \) \
                -not -path "./.git/*" \
                | sort
            )
            
            if [ "$FAILED" -ne 0 ]; then
              echo "OpenAPI validation failed."
              exit 1
            fi
            
            echo "All OpenAPI specifications are valid."

        - name: 📊 Generate job summary
          if: always()
          run: |
            {
              echo ""
              echo "## OpenAPI Validation"
              echo ""
              echo "| Check | Status |"
              echo "|---|---|"
              echo "| Specification discovery | Completed |"
              echo "| OpenAPI lint | Completed |"
              echo ""
              echo "### Result"
              echo "OpenAPI validation workflow finished."
            } >> "$GITHUB_STEP_SUMMARY"
